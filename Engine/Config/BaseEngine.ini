; Engine/Config/BaseEngine.ini
; Engine-level defaults for all projects.
; Projects override these in Config/DefaultEngine.ini.

[/Script/Engine.GameEngine]
GameWindowType=Console
GameWindowWidth=120
GameWindowHeight=40
MaxFPS=30

[/Script/Engine.RendererSettings]
DefaultRenderer=AsciiRenderer

[/Script/Engine.TickSystem]
; bSingleThreaded: true = all ticks on game thread (fallback/debug mode)
bSingleThreaded=false
; WorkerThreadCount: 0 = auto (hardware_concurrency - 1)
WorkerThreadCount=0
