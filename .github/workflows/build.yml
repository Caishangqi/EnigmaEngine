name: Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: BuildTool — build, unit tests, scaffolding integration
  # ---------------------------------------------------------------------------
  buildtool:
    name: BuildTool
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build BuildTool
        run: dotnet build Engine/Source/Programs/BuildTool/BuildTool.sln -c Release

      - name: Run unit tests
        shell: pwsh
        run: |
          $bt = "Engine/Source/Programs/BuildTool/Source/BuildTool/bin/Release/net9.0/BuildTool.exe"
          $tests = @(
            "module-parser"
            "dependency-resolver"
            "cmake-generator"
            "plugin-parser"
            "plugin-scanner"
            "thirdparty-scanner"
            "manifest-generator"
            "guid-generator"
            "module-api-header-generator"
            "vcxproj-generator"
            "solution-generator"
            "project-scanner"
            "automation-test-command"
            "automation-test-scanner"
            "automation-test-generator"
            "name-validator"
            "template-engine"
            "eproject-modifier"
            "target-file-modifier"
            "dependency-checker"
            "project-template-discovery"
            "project-parser"
            "create-project-command"
          )
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "--- $t ---" -ForegroundColor Cyan
            & $bt test $t
            if ($LASTEXITCODE -ne 0) { $failed += $t }
          }
          if ($failed.Count -gt 0) {
            Write-Host "`nFailed: $($failed -join ', ')" -ForegroundColor Red
            exit 1
          }

      - name: Run scaffolding-build-integration test
        shell: pwsh
        run: |
          $bt = "Engine/Source/Programs/BuildTool/Source/BuildTool/bin/Release/net9.0/BuildTool.exe"
          & $bt test scaffolding-build-integration
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload BuildTool artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildtool
          path: Engine/Source/Programs/BuildTool/Source/BuildTool/bin/Release/net9.0/
          retention-days: 1

  # --- PLACEHOLDER_STAGE2 ---

  # ---------------------------------------------------------------------------
  # Stage 2: Enigma Automation Tests
  # ---------------------------------------------------------------------------
  automation-tests:
    name: Automation Tests
    needs: [buildtool]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download BuildTool
        uses: actions/download-artifact@v4
        with:
          name: buildtool
          path: Engine/Source/Programs/BuildTool/Source/BuildTool/bin/Release/net9.0/

      - name: Run engine automation tests
        shell: pwsh
        run: |
          $bt = "Engine/Source/Programs/BuildTool/Source/BuildTool/bin/Release/net9.0/BuildTool.exe"
          & $bt automation-test "." --engine --run --profile ci-standard --report "Engine/Intermediate/AutomationTest/Reports"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # ---------------------------------------------------------------------------
  # Stage 3: C++ Unit Tests
  # ---------------------------------------------------------------------------
  cpp-unit-tests:
    name: C++ Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # -- Core.Math --
      - name: "Core.Math: Configure"
        run: cmake -B build-core-math -S Tests/Core.Math.Tests
      - name: "Core.Math: Build"
        run: cmake --build build-core-math --config Release
      - name: "Core.Math: Test"
        run: ctest --test-dir build-core-math --output-on-failure -C Release --progress

      # -- Core.Delegates --
      - name: "Core.Delegates: Configure"
        run: cmake -B build-core-delegates -S Tests/Core.Delegates.Tests
      - name: "Core.Delegates: Build"
        run: cmake --build build-core-delegates --config Release
      - name: "Core.Delegates: Test"
        run: ctest --test-dir build-core-delegates --output-on-failure -C Release --progress

      # -- Core.Config --
      - name: "Core.Config: Configure"
        run: cmake -B build-core-config -S Tests/Core.Config.Tests
      - name: "Core.Config: Build"
        run: cmake --build build-core-config --config Release
      - name: "Core.Config: Test"
        run: ctest --test-dir build-core-config --output-on-failure -C Release --progress

      # -- ApplicationCore --
      - name: "ApplicationCore: Configure"
        run: cmake -B build-appcore -S Tests/ApplicationCore.Tests
      - name: "ApplicationCore: Build"
        run: cmake --build build-appcore --config Release
      - name: "ApplicationCore: Test"
        run: ctest --test-dir build-appcore --output-on-failure -C Release --progress

      # -- RenderCore --
      - name: "RenderCore: Configure"
        run: cmake -B build-rendercore -S Tests/RenderCore.Tests
      - name: "RenderCore: Build"
        run: cmake --build build-rendercore --config Release
      - name: "RenderCore: Test"
        run: ctest --test-dir build-rendercore --output-on-failure -C Release --progress

      # -- Engine --
      - name: "Engine: Configure"
        run: cmake -B build-engine -S Tests/Engine.Tests
      - name: "Engine: Build"
        run: cmake --build build-engine --config Release
      - name: "Engine: Test"
        run: ctest --test-dir build-engine --output-on-failure -C Release --progress

      # -- Core.ThreadPool --
      - name: "Core.ThreadPool: Configure"
        run: cmake -B build-core-threadpool -S Tests/Core.ThreadPool.Tests
      - name: "Core.ThreadPool: Build"
        run: cmake --build build-core-threadpool --config Release
      - name: "Core.ThreadPool: Test"
        run: ctest --test-dir build-core-threadpool --output-on-failure -C Release --progress

      # -- Core.TaskGraph --
      - name: "Core.TaskGraph: Configure"
        run: cmake -B build-core-taskgraph -S Tests/Core.TaskGraph.Tests
      - name: "Core.TaskGraph: Build"
        run: cmake --build build-core-taskgraph --config Release
      - name: "Core.TaskGraph: Test"
        run: ctest --test-dir build-core-taskgraph --output-on-failure -C Release --progress

      # -- Engine.TickSystem --
      - name: "Engine.TickSystem: Configure"
        run: cmake -B build-engine-ticksystem -S Tests/Engine.TickSystem.Tests
      - name: "Engine.TickSystem: Build"
        run: cmake --build build-engine-ticksystem --config Release
      - name: "Engine.TickSystem: Test"
        run: ctest --test-dir build-engine-ticksystem --output-on-failure -C Release --progress

      # -- AsciiRenderer --
      - name: "AsciiRenderer: Configure"
        run: cmake -B build-ascii-renderer -S Tests/AsciiRenderer.Tests
      - name: "AsciiRenderer: Build"
        run: cmake --build build-ascii-renderer --config Release
      - name: "AsciiRenderer: Test"
        run: ctest --test-dir build-ascii-renderer --output-on-failure -C Release --progress

      # -- EnhancedInput --
      - name: "EnhancedInput: Configure"
        run: cmake -B build-enhanced-input -S Tests/EnhancedInput.Tests
      - name: "EnhancedInput: Build"
        run: cmake --build build-enhanced-input --config Release
      - name: "EnhancedInput: Test"
        run: ctest --test-dir build-enhanced-input --output-on-failure -C Release --progress

  # --- PLACEHOLDER_STAGE3 ---

  # ---------------------------------------------------------------------------
  # Stage 4: Engine Module Build Validation (standalone infrastructure tests)
  # ---------------------------------------------------------------------------
  engine-module-validation:
    name: Engine Module Validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # -- Core.DllExportMacro --
      - name: "Core.DllExportMacro: Configure"
        run: cmake -B build-dll-export-macro -S Tests/DllExportMacroTest
      - name: "Core.DllExportMacro: Build"
        run: cmake --build build-dll-export-macro --config Release
      - name: "Core.DllExportMacro: Test"
        run: ctest --test-dir build-dll-export-macro --output-on-failure -C Release

      # -- Core.ModuleInterface --
      - name: "Core.ModuleInterface: Configure"
        run: cmake -B build-module-interface -S Tests/ModuleInterfaceTest
      - name: "Core.ModuleInterface: Build"
        run: cmake --build build-module-interface --config Release
      - name: "Core.ModuleInterface: Test"
        run: ctest --test-dir build-module-interface --output-on-failure -C Release

      # -- Core.ModuleManager --
      - name: "Core.ModuleManager: Configure"
        run: cmake -B build-module-manager -S Tests/ModuleManagerTest
      - name: "Core.ModuleManager: Build"
        run: cmake --build build-module-manager --config Release
      - name: "Core.ModuleManager: Test"
        run: ctest --test-dir build-module-manager --output-on-failure -C Release

      # -- Launch.GuardedMain --
      - name: "Launch.GuardedMain: Configure"
        run: cmake -B build-launch-module -S Tests/LaunchModuleTest
      - name: "Launch.GuardedMain: Build"
        run: cmake --build build-launch-module --config Release
      - name: "Launch.GuardedMain: Test"
        run: ctest --test-dir build-launch-module --output-on-failure -C Release

      # -- ThirdParty.NlohmannJson --
      - name: "ThirdParty.NlohmannJson: Configure"
        run: cmake -B build-nlohmann-json -S Tests/NlohmannJsonTest
      - name: "ThirdParty.NlohmannJson: Build"
        run: cmake --build build-nlohmann-json --config Release
      - name: "ThirdParty.NlohmannJson: Test"
        run: ctest --test-dir build-nlohmann-json --output-on-failure -C Release

  # ---------------------------------------------------------------------------
  # Stage 5: Example Project Build — build all configs, package, upload
  # ---------------------------------------------------------------------------
  example-project-build:
    name: Example Project Build
    needs: [buildtool, automation-tests, cpp-unit-tests, engine-module-validation]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download BuildTool
        uses: actions/download-artifact@v4
        with:
          name: buildtool
          path: Engine/Source/Programs/BuildTool/Source/BuildTool/bin/Release/net9.0/

      - name: Build EnigmaArcade (all configurations)
        shell: pwsh
        run: |
          $bt = "Engine/Source/Programs/BuildTool/Source/BuildTool/bin/Release/net9.0/BuildTool.exe"
          foreach ($config in @("DebugGame", "Development", "Shipping")) {
            Write-Host "--- $config ---" -ForegroundColor Cyan
            & $bt clean EnigmaArcade
            & $bt build EnigmaArcade -c $config
            if ($LASTEXITCODE -ne 0) { exit 1 }

            if ($config -eq "Shipping") {
              $binDir = "EnigmaArcade/Binaries/Win64"
            } else {
              $binDir = "Engine/Binaries/Win64"
            }
            $exes = Get-ChildItem -Path $binDir -Filter "*.exe" -ErrorAction SilentlyContinue
            if ($exes.Count -eq 0) {
              Write-Host "No executables found in $binDir" -ForegroundColor Red
              exit 1
            }
            Write-Host "$config build verified." -ForegroundColor Green
          }

      - name: Package EnigmaArcade (Shipping)
        shell: pwsh
        run: |
          $bt = "Engine/Source/Programs/BuildTool/Source/BuildTool/bin/Release/net9.0/BuildTool.exe"
          & $bt package EnigmaArcade -o PackageOutput
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $pkgDir = "PackageOutput/Win64"
          $exes = Get-ChildItem -Path $pkgDir -Filter "*.exe" -Recurse
          if ($exes.Count -eq 0) {
            Write-Host "No executables found in package" -ForegroundColor Red
            exit 1
          }
          Write-Host "Package contents:" -ForegroundColor Green
          Get-ChildItem -Path $pkgDir -Recurse | ForEach-Object {
            Write-Host "  $($_.FullName.Replace((Get-Location).Path + '\', ''))"
          }

      - name: Upload EnigmaArcade package
        uses: actions/upload-artifact@v4
        with:
          name: EnigmaArcade-Win64-Shipping
          path: PackageOutput/Win64/
          retention-days: 30
